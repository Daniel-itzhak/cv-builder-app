services:
  postgres:
    image: postgres:16-alpine
    container_name: cv-builder-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cv_user
      POSTGRES_PASSWORD: cv_password
      POSTGRES_DB: cv_builder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_user -d cv_builder"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
